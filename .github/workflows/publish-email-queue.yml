name: Publish email queue to npm

on:
  push:
    tags: ["email-queue-v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref whose package version should be published
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EMAIL_QUEUE_TEST_REDIS_URL: redis://127.0.0.1:6379
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit -p tsconfig.json
      - run: bun test packages/email-queue/test
      - name: Check tag version
        if: github.event_name == 'push'
        working-directory: packages/email-queue
        run: |
          test "${GITHUB_REF_NAME#email-queue-v}" = "$(node -p 'require("./package.json").version')"
      - name: Build
        working-directory: packages/email-queue
        run: bun run build
      - name: Publish
        working-directory: packages/email-queue
        run: npm publish --access public
