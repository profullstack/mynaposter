name: Publish email queue to npm

on:
  push:
    tags: ["email-queue-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EMAIL_QUEUE_TEST_REDIS_URL: redis://127.0.0.1:6379
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit -p tsconfig.json
      - run: bun test packages/email-queue/test
      - name: Build and check tag version
        working-directory: packages/email-queue
        run: |
          test "${GITHUB_REF_NAME#email-queue-v}" = "$(node -p 'require("./package.json").version')"
          bun run build
      - name: Publish
        working-directory: packages/email-queue
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
